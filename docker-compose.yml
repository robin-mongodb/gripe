# Single-EC2 deploy. Aurora + Atlas are managed — no DB containers.
# ponytail: SQS creds via IAM role on the EC2 instance in prod; env vars only for local override.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on: [web, api]
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: Dockerfile.web }
    environment:
      NEXT_PUBLIC_API_BASE: /v1
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: .env
    environment:
      API_ADDR: ":8080"
    restart: unless-stopped

  fraud-worker:
    build: { context: ., dockerfile: Dockerfile.fraud-worker }
    env_file: .env
    restart: unless-stopped

  fee-worker:
    build: { context: ., dockerfile: Dockerfile.fee-worker }
    env_file: .env
    restart: unless-stopped

  cycler:
    build: { context: ., dockerfile: Dockerfile.cycler }
    env_file: .env
    restart: unless-stopped

  # `seed` is a one-shot CLI, not a long-running service. Invoke with:
  #   docker compose run --rm seed -m 5 -p 40 -s 3
  # Override GRIPE_BACKEND with `-e GRIPE_BACKEND=postgres` to target RDS instead of Atlas.
  seed:
    build: { context: ., dockerfile: Dockerfile.seed }
    env_file: .env
    profiles: ["tools"]
